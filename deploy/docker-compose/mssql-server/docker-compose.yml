
services:
  mssql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-server
    networks:
    - edonusum
    ports:
    - 1433:1433
    volumes:
    - mssql-data:/var/opt/mssql
    environment:
    - SA_PASSWORD=StrongPassword123!
    - ACCEPT_EULA=Y

volumes:
  mssql-data:

networks:
  edonusum:
    external: true